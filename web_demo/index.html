<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Can't Stop — Browser Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">CS 441 ML PROJECT</p><h1>Can't Stop</h1><p id="subtitle" class="subtitle">An RL opponent running locally in your browser</p></div>
      <button id="new-game" class="secondary">New game</button>
    </header>
    <section class="status" aria-live="polite"><span id="turn-label"></span><span id="model-label">Loading models…</span><span id="message"></span></section>
    <section class="agent-panel">
      <label id="player-a-label">Player A (first player)<select id="agent-a"></select></label>
      <label id="player-b-label">Player B<select id="agent-b"></select></label>
      <button id="apply-agents" class="secondary">Apply game settings</button>
    </section>
    <section class="board-heading"><strong id="board-label">Board</strong><span id="neutral-label">Neutral markers: 0 / 3</span></section>
    <section id="board" class="board"></section>
    <section class="dice-panel"><div id="dice" class="dice"></div><div id="moves" class="moves"></div></section>
    <section class="controls"><button id="roll">Roll dice</button><button id="stop" class="stop" disabled>Stop and bank</button><button id="continue" class="continue" disabled>Continue</button></section>
    <details><summary id="model-info">Model and runtime information</summary><pre id="debug"></pre></details>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
