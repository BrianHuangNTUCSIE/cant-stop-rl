<!doctype html>
<meta charset="utf-8">
<title>vmerckle browser benchmark</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 2rem; }
  pre { white-space: pre-wrap; }
</style>
<h1>vmerckle browser benchmark</h1>
<p>Development-only benchmark. It does not load or modify the game UI.</p>
<button id="run">Run benchmark</button>
<pre id="output">Waiting…</pre>
<script type="module">
import {legalMoves} from '../js/game.js';
import {randomSearchRollout, searchRootActions} from '../js/vmerckle.js';

const output = document.querySelector('#output');
const state = {
  permanent: [Array(11).fill(0), Array(11).fill(0)],
  owner: Array(11).fill(-1), active: {6: 4, 7: 5}, player: 0,
  rolls: 2, phase: 'decision', winner: null,
};

function makeActions() {
  const moves = legalMoves([1, 2, 3, 4], state);
  return moves.flatMap(move => [0, 1].map(action => {
    const post = {...state, active: {...state.active}, phase: 'decision'};
    for (const column of move) {
      post.active[column] = (post.active[column] ?? state.permanent[state.player][column - 2]) + 1;
    }
    return {move, action, post};
  }));
}

function seededRng(seed) {
  let value = seed >>> 0;
  return () => {
    value = (1664525 * value + 1013904223) >>> 0;
    return value / 0x100000000;
  };
}

async function runRollouts(count) {
  const start = performance.now();
  let wins = 0;
  for (let i = 0; i < count; i++) {
    wins += await randomSearchRollout(state, i % 2, 0, {
      rng: seededRng(441 + i), yieldEvery: 0,
    });
  }
  const elapsed = performance.now() - start;
  return {elapsed_ms: Number(elapsed.toFixed(3)), wins};
}

async function measureRootAgent(name, cancelAfter = Infinity) {
  let cancel = false;
  let lastProgress = performance.now();
  const start = lastProgress;
  const result = await searchRootActions(makeActions(), 0, name, {
    rng: seededRng(12345),
    isCancelled: () => cancel,
    onRollout: ({rollouts}) => {
      lastProgress = performance.now();
      if (rollouts >= cancelAfter) cancel = true;
      if (rollouts === 1 || rollouts % 8 === 0) {
        output.textContent = `${name}: ${rollouts} rollouts completed…`;
      }
    },
  });
  return {
    result: result === null ? null : {
      index: result.index, rollouts: result.rollouts, yields: result.yields,
      wins: result.wins, plays: result.plays,
    },
    elapsed_ms: Number((performance.now() - start).toFixed(3)),
    last_progress_ms: Number((lastProgress - start).toFixed(3)),
  };
}

async function measureCancellation() {
  let cancelled = false;
  setTimeout(() => { cancelled = true; }, 0);
  const start = performance.now();
  const result = await randomSearchRollout(state, 1, 0, {
    rng: seededRng(99),
    yieldEvery: 32,
    isCancelled: () => cancelled,
  });
  return {
    result,
    latency_ms: Number((performance.now() - start).toFixed(3)),
  };
}

document.querySelector('#run').addEventListener('click', async event => {
  event.target.disabled = true;
  output.textContent = 'Running…';
  try {
    const rollouts = 1000;
    output.textContent = 'Measuring single-rollout throughput…';
    const measured = await runRollouts(rollouts);
    output.textContent = 'Measuring vmerckle Monte root search…';
    const monte = await measureRootAgent('vmerckle_monte');
    output.textContent = 'Measuring vmerckle UCT root search…';
    const uct = await measureRootAgent('vmerckle_monte_uct');
    output.textContent = 'Measuring cancellation…';
    const canceledMonte = await measureRootAgent('vmerckle_monte', 1);
    const cancellation = await measureCancellation();
    output.textContent = JSON.stringify({
      rollouts,
      ...measured,
      rollouts_per_second: Number((rollouts / (measured.elapsed_ms / 1000)).toFixed(1)),
      cancellation,
      root_agents: {monte, uct, canceled_monte: canceledMonte},
      user_agent: navigator.userAgent,
    }, null, 2);
  } catch (error) {
    output.textContent = `${error.name}: ${error.message}`;
  } finally {
    event.target.disabled = false;
  }
});
</script>
