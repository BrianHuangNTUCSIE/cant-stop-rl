[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cant-stop"
version = "0.1.0"
description = "Reusable, deterministic Can't Stop game engine and research agents"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "CS 441 Can't Stop project"}]
dependencies = []

[project.optional-dependencies]
ml = ["numpy>=2,<3", "scikit-learn>=1.6,<2"]
rl = ["numpy>=2,<3", "torch>=2.6,<3"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
cant-stop = "cant_stop_core.cli:main"

[tool.setuptools]
package-dir = {"" = "cant_stop_baselines"}
py-modules = ["cant_stop"]

[tool.setuptools.packages.find]
where = ["cant_stop_baselines"]
include = ["cant_stop_core*", "learners*", "rollout*"]

[tool.pytest.ini_options]
testpaths = ["cant_stop_baselines/tests"]
