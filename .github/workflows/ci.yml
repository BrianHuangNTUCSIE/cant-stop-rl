name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install --no-deps -e .

      - name: Run test suite
        working-directory: cant_stop_baselines
        run: python -m unittest discover -s tests -t . -v

      - name: Run CLI smoke test
        run: cant-stop --agent-a rule28-smart --agent-b random --games 3 --seed 42 --json
